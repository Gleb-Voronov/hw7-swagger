tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact with optional photo upload.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            example: john@example.com
          phone:
            type: string
            example: '+380931234567'
          photo:
            type: string
            format: binary
responses:
  201:
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: 'Contact created successfully'
            data:
              $ref: '../../components/schemas/contact.yaml'
  400:
    $ref: '../../components/responses/400.yaml'
  401:
    $ref: '../../components/responses/401.yaml'
