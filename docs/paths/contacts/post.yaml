tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authorized user.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - phone
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            example: johndoe@example.com
          phone:
            type: string
            example: +380991112233
          isFavourite:
            type: boolean
            example: false
responses:
  '201':
    description: Successfully created contact
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
