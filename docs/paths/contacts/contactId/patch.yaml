tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update contact details by ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: ID of the contact
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
          phone:
            type: string
          isFavourite:
            type: boolean
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
