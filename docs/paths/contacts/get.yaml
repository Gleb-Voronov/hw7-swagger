tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of all user contacts with pagination and search.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number
    required: false
    schema:
      type: integer
      example: 1
  - name: limit
    in: query
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      example: 10
  - name: search
    in: query
    description: Search contacts by name or email
    required: false
    schema:
      type: string
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
