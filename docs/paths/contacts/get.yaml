tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a paginated list of contacts.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: Page number for pagination
  - in: query
    name: limit
    schema:
      type: integer
      example: 10
    description: Number of contacts per page
  - in: query
    name: sort
    schema:
      type: string
      example: name
    description: Field to sort by
responses:
  200:
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
            - pagination
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: 'Contacts fetched successfully'
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
            pagination:
              type: object
              properties:
                totalDocs:
                  type: integer
                  example: 42
                totalPages:
                  type: integer
                  example: 5
                currentPage:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
  401:
    $ref: '../../components/responses/401.yaml'
