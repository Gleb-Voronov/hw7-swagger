type: object
properties:
  id:
    type: string
    example: '64f9d1b87f3c0a4d2c123456'
  name:
    type: string
    example: 'John Doe'
  email:
    type: string
    example: 'john@example.com'
  phone:
    type: string
    example: '+380931234567'
  photo:
    type: string
    example: 'https://example.com/uploads/photo.jpg'
  createdAt:
    type: string
    format: date-time
    example: '2025-09-07T12:34:56.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-09-07T12:34:56.000Z'
