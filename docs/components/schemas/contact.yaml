type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    example: 68bfe55c0760c26aa7319b36
  name:
    type: string
    example: John Doe
  phoneNumber:
    type: string
    example: +380123456789
  email:
    type: string
    example: john@example.com
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    enum: [personal, work]
    example: work
  userId:
    type: string
    example: 68bfe3db0760c26aa7319b18
  photo:
    type: string
    nullable: true
    example: null
  createdAt:
    type: string
    format: date-time
    example: 2025-09-09T08:29:16.587Z
  updatedAt:
    type: string
    format: date-time
    example: 2025-09-09T08:29:16.587Z
