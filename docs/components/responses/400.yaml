description: Bad Request
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: 'Invalid request data'
        data:
          type: object
          properties:
            message:
              type: string
              example: "Field 'email' is required"
