description: Unauthorized error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: Access token expired
              description: Detailed reason for unauthorized error (e.g. "Invalid token", "Token not provided", "Access token expired").
